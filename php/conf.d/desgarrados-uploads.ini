; Limites do projeto para upload de mídia editorial (10 MB por imagem + margem do formulário).
; Não altera o php.ini global: só vale quando o PHP é iniciado com este diretório no PHP_INI_SCAN_DIR, por exemplo
;   PHP_INI_SCAN_DIR=":$PWD/php/conf.d" composer dev
upload_max_filesize = 12M
post_max_size = 16M
